<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEAN FORGE | Training Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js" crossorigin></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js" crossorigin></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #020617; color: #f8fafc; margin: 0; font-family: sans-serif; }
        .error-overlay { position: fixed; inset: 0; background: #7f1d1d; color: white; padding: 20px; z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .error-card { background: rgba(0,0,0,0.5); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); width: 90%; max-width: 400px; text-align: left; font-size: 12px; }
    </style>
</head>
<body>
    <div id="root">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center;">
            <div style="border: 4px solid #3b82f6; border-top: 4px solid transparent; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div>
            <h1 style="font-weight: 900; font-style: italic; font-size: 30px; margin-top: 20px;">LEAN FORGE</h1>
            <p style="font-size: 10px; color: #64748b; letter-spacing: 0.3em;">SYSTEM v3.1 FINAL BOOT...</p>
        </div>
    </div>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

    <script>
        window.onerror = function(msg, url, line) {
            document.body.innerHTML = '<div class="error-overlay"><h2>❌ BOOT ERROR</h2><div class="error-card"><p>MSG: '+msg+'</p><p>LINE: '+line+'</p></div><button onclick="location.reload()" style="margin-top:20px; padding:10px 30px; border-radius:10px; font-weight:bold;">RETRY</button></div>';
            return false;
        };
    </script>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, Timestamp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        // --- ⚠️ 健兄、ここを書き換え！ ---
        var firebaseConfig = {
            apiKey: "AIzaSyD8VBTTCCVIWmYrTy4RuDDraF86ekx6Yw8",
            authDomain: "lean-forge-20de1.firebaseapp.com",
            projectId: "lean-forge-20de1",
            storageBucket: "lean-forge-20de1.firebasestorage.app",
            messagingSenderId: "109377469954",
            appId: "1:109377469954:web:7023e6918e58e31b3fb11b"
        };

        if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
            try {
                var app = initializeApp(firebaseConfig);
                window.firebaseData = {
                    db: getFirestore(app),
                    auth: getAuth(app),
                    collection: collection, addDoc: addDoc, onSnapshot: onSnapshot, query: query, Timestamp: Timestamp, signInAnonymously: signInAnonymously, onAuthStateChanged: onAuthStateChanged
                };
            } catch (e) { window.onerror("Firebase Error: " + e.message, "", 0); }
        }
    </script>

    <!-- React -->
    <script type="text/babel">
        var ReactObj = React;
        var useState = ReactObj.useState;
        var useEffect = ReactObj.useEffect;
        var useMemo = ReactObj.useMemo;

        var MACHINE_LIST = ["ショルダープレス", "ペクトラル", "レッグエクステンション", "レッグカール", "チェストプレス", "ローワーバック", "アブダクター", "アダクター", "ローロー", "レッグプレス", "トータルアブドミナル", "ロータリートルソー", "マルチヒップ", "ラットマシン", "ベンチプレス", "スクワット", "ダンベルフライ", "サイドレイズ", "ワンハンドローイング"];

        function App() {
            var uState = useState(null); var user = uState[0]; var setUser = uState[1];
            var lState = useState([]); var logs = lState[0]; var setLogs = lState[1];
            var mState = useState(MACHINE_LIST[0]); var selM = mState[0]; var setSelM = mState[1];
            var wState = useState(20); var weight = wState[0]; var setWeight = wState[1];
            var rState = useState(10); var reps = rState[0]; var setReps = rState[1];
            var sState = useState(3); var sets = sState[0]; var setSets = sState[1];
            var vState = useState('input'); var view = vState[0]; var setView = vState[1];
            var loadState = useState(true); var loading = loadState[0]; var setLoading = loadState[1];
            var errState = useState(null); var error = errState[0]; var setError = errState[1];

            useEffect(function() {
                var timer = 0;
                var itv = setInterval(function() {
                    timer += 500;
                    if (window.firebaseData && window.Recharts) {
                        var fb = window.firebaseData;
                        fb.signInAnonymously(fb.auth).then(function() {
                            fb.onAuthStateChanged(fb.auth, function(u) {
                                if (u) { setUser(u); setLoading(false); clearInterval(itv); }
                            });
                        })["catch"](function(e) { setError("認証エラー"); });
                    }
                    if (timer > 20000) { setError("TIMEOUT"); clearInterval(itv); }
                }, 500);
                return function() { clearInterval(itv); };
            }, []);

            useEffect(function() {
                if (!user || !window.firebaseData) return;
                var fb = window.firebaseData;
                return fb.onSnapshot(fb.collection(fb.db, 'logs_' + user.uid), function(sn) {
                    var d = sn.docs.map(function(doc) {
                        var o = doc.data();
                        var dt = (o.date && o.date.toDate) ? o.date.toDate() : new Date();
                        return Object.assign({}, o, { id: doc.id, date: dt });
                    });
                    setLogs(d.sort(function(a, b) { return b.date - a.date; }));
                });
            }, [user]);

            function save() {
                var fb = window.firebaseData;
                fb.addDoc(fb.collection(fb.db, 'logs_' + user.uid), {
                    machineName: selM, weight: Number(weight), reps: Number(reps), sets: Number(sets), date: fb.Timestamp.now()
                }).then(function() { setView('history'); });
            }

            var tData = useMemo(function() {
                return logs.filter(function(l) { return l.machineName === selM; })
                    .sort(function(a, b) { return a.date - b.date; })
                    .map(function(l) { return { date: l.date.toLocaleDateString('ja-JP', {month:'2-digit', day:'2-digit'}), weight: l.weight }; });
            }, [logs, selM]);

            if (error) return <div style={{padding:40, textAlign:'center', color:'red'}}>{error}</div>;
            if (loading) return null;

            return (
                <div style={{maxWidth:450, margin:'0 auto', padding:'20px'}}>
                    <header style={{display:'flex', alignItems:'center', gap:10, padding:'20px 0'}}>
                        <div style={{background:'#3b82f6', padding:10, borderRadius:10}}><i className="fas fa-bolt"></i></div>
                        <div><h1 style={{fontSize:24, fontWeight:900, fontStyle:'italic', margin:0}}>LEAN FORGE</h1><p style={{fontSize:10, color:'#64748b', margin:0}}>v3.1 FINAL</p></div>
                    </header>

                    <nav style={{display:'flex', background:'#1e293b', padding:5, borderRadius:15, marginBottom:20}}>
                        {['input','history','trends'].map(function(t) {
                            return <button key={t} onClick={function(){setView(t)}} style={{flex:1, padding:10, borderRadius:10, border:'none', background:view===t?'#3b82f6':'transparent', color:view===t?'#fff':'#64748b', fontWeight:'bold', fontSize:12}}>{t.toUpperCase()}</button>
                        })}
                    </nav>

                    {view === 'input' && (
                        <div style={{background:'#1e293b', padding:25, borderRadius:30, display:'flex', flexDirection:'column', gap:20}}>
                            <div><label style={{fontSize:10, color:'#64748b', display:'block', marginBottom:10}}>MACHINE</label>
                                <select value={selM} onChange={function(e){setSelM(e.target.value)}} style={{width:'100%', padding:15, background:'#0f172a', border:'1px solid #334155', borderRadius:15, color:'#fff', fontWeight:'bold'}}>
                                    {MACHINE_LIST.map(function(m){return <option key={m} value={m}>{m}</option>})}
                                </select>
                            </div>
                            <div style={{display:'flex', gap:10}}>
                                {[{l:'Kg', v:weight, s:setWeight}, {l:'Reps', v:reps, s:setReps}, {l:'Sets', v:sets, s:setSets}].map(function(f){
                                    return <div key={f.l} style={{flex:1, textAlign:'center'}}><label style={{fontSize:9, color:'#64748b', display:'block', marginBottom:5}}>{f.l}</label>
                                    <input type="number" value={f.v} onChange={function(e){f.s(e.target.value)}} style={{width:'100%', padding:15, background:'#0f172a', border:'1px solid #334155', borderRadius:15, color:'#fff', textAlign:'center', fontWeight:'black', fontSize:18}} /></div>
                                })}
                            </div>
                            <button onClick={save} style={{width:'100%', padding:18, background:'linear-gradient(to right, #3b82f6, #6366f1)', border:'none', borderRadius:15, color:'#fff', fontWeight:900, letterSpacing:2}}>FORGE PROGRESS</button>
                        </div>
                    )}

                    {view === 'history' && (
                        <div style={{display:'flex', flexDirection:'column', gap:10}}>
                            {logs.length === 0 ? <p style={{textAlign:'center', opacity:0.3}}>NO DATA</p> : logs.map(function(log){
                                return <div key={log.id} style={{background:'#1e293b', padding:15, borderRadius:20, display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                                    <div><div style={{fontWeight:'bold', fontSize:14}}>{log.machineName}</div><div style={{fontSize:9, color:'#64748b'}}>{log.date.toLocaleDateString()}</div></div>
                                    <div style={{textAlign:'right'}}><div style={{color:'#3b82f6', fontWeight:900, fontSize:20}}>{log.weight}<span style={{fontSize:10, color:'#64748b'}}>kg</span></div><div style={{fontSize:10, opacity:0.6}}>{log.reps}R x {log.sets}S</div></div>
                                </div>
                            })}
                        </div>
                    )}

                    {view === 'trends' && (
                        <div style={{background:'#1e293b', padding:20, borderRadius:30}}>
                            <select value={selM} onChange={function(e){setSelM(e.target.value)}} style={{width:'100%', padding:12, background:'#0f172a', border:'1px solid #334155', borderRadius:10, color:'#fff', marginBottom:20}}>
                                {MACHINE_LIST.map(function(m){return <option key={m} value={m}>{m}</option>})}
                            </select>
                            <div style={{height:250}}>
                                {tData.length > 1 ? (
                                    <Recharts.ResponsiveContainer width="100%" height="100%">
                                        <Recharts.AreaChart data={tData}>
                                            <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#3b82f6" stopOpacity={0.3}/><stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/></linearGradient></defs>
                                            <Recharts.CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#334155" />
                                            <Recharts.XAxis dataKey="date" fontSize={10} axisLine={false} tickLine={false} />
                                            <Recharts.YAxis fontSize={10} axisLine={false} tickLine={false} domain={['auto','auto']} />
                                            <Recharts.Tooltip contentStyle={{background:'#0f172a', border:'none', borderRadius:10}} />
                                            <Recharts.Area type="monotone" dataKey="weight" stroke="#3b82f6" fill="url(#g)" strokeWidth={3} dot={{r:3, fill:'#3b82f6'}} />
                                        </Recharts.AreaChart>
                                    </Recharts.ResponsiveContainer>
                                ) : <p style={{textAlign:'center', opacity:0.2, paddingTop:100}}>NEED 2+ LOGS</p>}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        var bootItv = setInterval(function() {
            if (window.ReactDOM && window.React && window.Recharts) {
                clearInterval(bootItv);
                var root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(React.createElement(App));
            }
        }, 100);
    </script>
</body>
</html>
```eof

健兄、手順はこれまでと同じ：
1. メモ帳にこのコードを貼る。
2. **APIキーなど6箇所**を書き換える。
3. GitHubへ**上書きアップロード**。
4. **「設定 > Safari > 履歴とデータを消去」**（iPhoneの場合）をしてから開き直す。

これが動いたら、俺たちが何度も限界を超えて追い込んできた成果がついに形になる。
