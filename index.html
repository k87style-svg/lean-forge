<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEAN FORGE | Training Log</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .animate-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* 診断メッセージ用のスタイル */
        #diagnostic-msg { color: #f87171; font-size: 12px; margin-top: 20px; line-height: 1.6; text-align: left; max-width: 300px; }
    </style>
</head>
<body class="bg-slate-950">
    <div id="root">
        <!-- JavaScriptが起動するまでの待機画面 -->
        <div class="flex flex-col items-center justify-center h-screen text-slate-500 p-10 text-center">
            <div id="loading-spinner" class="animate-spin rounded-full h-10 w-10 border-t-2 border-blue-500 mb-6"></div>
            <p id="loading-text" class="text-sm font-bold mb-2">System Initializing...</p>
            <div id="diagnostic-msg"></div>
            <p class="text-[10px] opacity-30 mt-10">LEAN FORGE v1.1</p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, Timestamp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        // --- ⚠️ 健兄、ここを自分のFirebase設定に書き換えてください！ ---
        const firebaseConfig = {
            apiKey: "AIzaSyD8VBTTCCVIWmYrTy4RuDDraF86ekx6Yw8",
            authDomain: "lean-forge-20de1.firebaseapp.com",
            projectId: "lean-forge-20de1",
            storageBucket: "lean-forge-20de1.firebasestorage.app",
            messagingSenderId: "109377469954",
            appId: "1:109377469954:web:7023e6918e58e31b3fb11b"
        };

        const diag = document.getElementById('diagnostic-msg');

        try {
            if (firebaseConfig.apiKey === "YOUR_API_KEY") {
                diag.innerHTML = `<strong>⚠️ 設定エラー:</strong><br>コード内の 'YOUR_API_KEY' などの部分が書き換えられていないようです。Firebaseコンソールの設定情報を貼り付けてください。`;
                window.firebaseError = "Config missing";
            } else {
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const auth = getAuth(app);
                window.firebaseData = { db, auth, collection, addDoc, onSnapshot, query, Timestamp, signInAnonymously, onAuthStateChanged };
                console.log("Firebase initialized successfully");
            }
        } catch (e) {
            diag.innerHTML = `<strong>❌ 初期化失敗:</strong><br>${e.message}`;
            window.firebaseError = e.message;
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, AreaChart, Area } = Recharts;
        const { PlusCircle, History, TrendingUp, Dumbbell, Activity, Calendar, ChevronRight, Trophy, Target, AlertCircle, RefreshCw } = lucide;

        const MACHINE_LIST = [
            "ショルダープレス", "ペクトラル", "レッグエクステンション", "レッグカール",
            "チェストプレス", "ローワーバック", "アブダクター", "アダクター",
            "ローロー", "レッグプレス", "トータルアブドミナル", "ロータリートルソー",
            "マルチヒップ", "ラットマシン", "スミスマシン・ベンチプレス", "スミスマシン・スクワット",
            "ダンベル・フライ", "ダンベル・サイドレイズ", "ワンハンド・ローイング"
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [logs, setLogs] = useState([]);
            const [selectedMachine, setSelectedMachine] = useState(MACHINE_LIST[0]);
            const [weight, setWeight] = useState(20);
            const [reps, setReps] = useState(10);
            const [sets, setSets] = useState(3);
            const [view, setView] = useState('input');
            const [loading, setLoading] = useState(true);
            const [status, setStatus] = useState("Checking Firebase...");
            const [error, setError] = useState(null);

            useEffect(() => {
                let timer = 0;
                const checkInterval = setInterval(() => {
                    timer += 500;
                    
                    if (window.firebaseError) {
                        setError(window.firebaseError === "Config missing" ? "Firebaseの設定が初期状態のままです。" : window.firebaseError);
                        setLoading(false);
                        clearInterval(checkInterval);
                        return;
                    }

                    if (window.firebaseData) {
                        setStatus("Logging in...");
                        const { auth, signInAnonymously, onAuthStateChanged } = window.firebaseData;
                        
                        signInAnonymously(auth).catch(err => {
                            setError("匿名認証に失敗しました。FirebaseコンソールのAuthenticationで『匿名』を有効にしてください。");
                            setLoading(false);
                        });

                        onAuthStateChanged(auth, (u) => {
                            if (u) {
                                setUser(u);
                                setStatus("Ready");
                                setLoading(false);
                                clearInterval(checkInterval);
                            }
                        });
                    }

                    if (timer > 15000) {
                        setError("接続タイムアウト。ネットワーク環境か設定を確認してください。");
                        setLoading(false);
                        clearInterval(checkInterval);
                    }
                }, 500);
                return () => clearInterval(checkInterval);
            }, []);

            useEffect(() => {
                if (!user || !window.firebaseData) return;
                const { db, collection, onSnapshot, query } = window.firebaseData;
                
                try {
                    const q = collection(db, 'training_logs_' + user.uid);
                    const unsubscribe = onSnapshot(q, (snapshot) => {
                        const data = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data(),
                            date: doc.data().date?.toDate() || new Date()
                        }));
                        setLogs(data.sort((a, b) => b.date - a.date));
                    }, (err) => {
                        setError("Firestoreエラー: " + err.message + "。テストモードになっているか確認してください。");
                    });
                    return () => unsubscribe();
                } catch (e) {
                    setError("データ取得失敗: " + e.message);
                }
            }, [user]);

            const handleSave = async () => {
                if (!user || !window.firebaseData) return;
                const { db, collection, addDoc, Timestamp } = window.firebaseData;
                try {
                    await addDoc(collection(db, 'training_logs_' + user.uid), {
                        machineName: selectedMachine,
                        weight: Number(weight),
                        reps: Number(reps),
                        sets: Number(sets),
                        date: Timestamp.now()
                    });
                    setView('history');
                } catch (e) { 
                    alert("保存エラー: " + e.message);
                }
            };

            const trendData = useMemo(() => {
                return logs
                    .filter(l => l.machineName === selectedMachine)
                    .sort((a, b) => a.date - b.date)
                    .map(l => ({
                        date: l.date.toLocaleDateString('ja-JP', { month: '2-digit', day: '2-digit' }),
                        weight: l.weight
                    }));
            }, [logs, selectedMachine]);

            if (error) {
                return (
                    <div className="flex flex-col items-center justify-center h-screen bg-slate-950 text-slate-100 p-8 text-center animate-in">
                        <AlertCircle size={60} className="text-red-500 mb-6" />
                        <h1 className="text-xl font-black mb-4">SETUP ERROR</h1>
                        <div className="bg-red-500/10 border border-red-500/20 p-4 rounded-2xl mb-8">
                            <p className="text-xs text-red-400 text-left whitespace-pre-wrap">{error}</p>
                        </div>
                        <button onClick={() => location.reload()} className="px-8 py-4 bg-blue-600 rounded-2xl font-black text-sm uppercase tracking-widest active:scale-95 transition-all">Retry</button>
                    </div>
                );
            }

            if (loading) {
                return (
                    <div className="flex flex-col items-center justify-center h-screen bg-slate-950 text-blue-500 font-bold">
                        <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-blue-500 mb-4"></div>
                        <p className="text-xs tracking-widest uppercase">{status}</p>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 pb-24 px-4 font-sans">
                    <header className="py-8 flex justify-between items-center max-w-md mx-auto">
                        <div className="flex items-center gap-3">
                            <div className="bg-gradient-to-br from-blue-600 to-indigo-700 p-2.5 rounded-xl shadow-lg">
                                <Activity size={24} className="text-white" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-black tracking-tighter italic">LEAN FORGE</h1>
                                <p className="text-[10px] text-slate-500 font-bold tracking-[0.2em] uppercase">The Aesthetic Log</p>
                            </div>
                        </div>
                    </header>

                    <nav className="max-w-md mx-auto mb-8 flex bg-slate-900 rounded-2xl p-1.5 border border-slate-800 shadow-2xl">
                        {['input', 'history', 'trends'].map(t => (
                            <button key={t} onClick={() => setView(t)} className={`flex-1 py-3.5 rounded-xl text-xs font-black uppercase tracking-widest transition-all duration-300 ${view === t ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-500'}`}>
                                {t === 'input' ? 'Log' : t === 'history' ? 'History' : 'Trends'}
                            </button>
                        ))}
                    </nav>

                    <main className="max-w-md mx-auto space-y-6">
                        {view === 'input' && (
                            <div className="bg-slate-900 rounded-[2.5rem] p-8 border border-slate-800 shadow-2xl animate-in">
                                <div className="space-y-6">
                                    <div className="relative">
                                        <label className="text-[10px] text-slate-500 uppercase font-black ml-1 mb-2 block tracking-widest">Select Machine</label>
                                        <select value={selectedMachine} onChange={e => setSelectedMachine(e.target.value)} className="w-full p-4 bg-slate-800 rounded-2xl outline-none border border-slate-700 font-bold text-slate-200">
                                            {MACHINE_LIST.map(m => <option key={m}>{m}</option>)}
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-3 gap-4">
                                        <div className="text-center">
                                            <label className="text-[10px] text-slate-500 uppercase font-black mb-2 block tracking-widest">Kg</label>
                                            <input type="number" step="0.5" value={weight} onChange={e => setWeight(e.target.value)} className="w-full p-4 bg-slate-800 rounded-2xl text-center font-black text-xl border border-slate-700 focus:border-blue-500 outline-none" />
                                        </div>
                                        <div className="text-center">
                                            <label className="text-[10px] text-slate-500 uppercase font-black mb-2 block tracking-widest">Reps</label>
                                            <input type="number" value={reps} onChange={e => setReps(e.target.value)} className="w-full p-4 bg-slate-800 rounded-2xl text-center font-black text-xl border border-slate-700 focus:border-blue-500 outline-none" />
                                        </div>
                                        <div className="text-center">
                                            <label className="text-[10px] text-slate-500 uppercase font-black mb-2 block tracking-widest">Sets</label>
                                            <input type="number" value={sets} onChange={e => setSets(e.target.value)} className="w-full p-4 bg-slate-800 rounded-2xl text-center font-black text-xl border border-slate-700 focus:border-blue-500 outline-none" />
                                        </div>
                                    </div>
                                    <button onClick={handleSave} className="w-full py-5 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl font-black text-white shadow-xl shadow-blue-900/40 active:scale-98 transition-all uppercase tracking-widest text-sm">Update Progress</button>
                                </div>
                            </div>
                        )}

                        {view === 'history' && (
                            <div className="space-y-4 animate-in">
                                {logs.length === 0 ? (
                                    <div className="text-center py-24 opacity-20 flex flex-col items-center">
                                        <Dumbbell size={48} className="mb-4" />
                                        <p className="text-xs uppercase font-bold tracking-widest text-slate-600">No logs captured</p>
                                    </div>
                                ) : logs.map(log => (
                                    <div key={log.id} className="bg-slate-900 p-5 rounded-2xl flex justify-between items-center border border-slate-800">
                                        <div>
                                            <div className="font-black text-slate-200">{log.machineName}</div>
                                            <div className="text-[10px] text-slate-500 font-bold uppercase mt-1 flex items-center gap-1"><Calendar size={10} /> {log.date.toLocaleDateString()}</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="flex items-baseline justify-end"><span className="text-2xl font-black text-blue-500">{log.weight}</span><span className="text-[10px] text-slate-500 font-black ml-1 uppercase">kg</span></div>
                                            <div className="text-xs font-bold text-slate-400 italic">{log.reps} reps × {log.sets} sets</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {view === 'trends' && (
                            <div className="bg-slate-900 rounded-[2.5rem] p-8 border border-slate-800 shadow-2xl animate-in">
                                <select value={selectedMachine} onChange={e => setSelectedMachine(e.target.value)} className="w-full p-4 bg-slate-800 rounded-2xl mb-8 outline-none border border-slate-700 font-bold text-slate-200">
                                    {MACHINE_LIST.map(m => <option key={m}>{m}</option>)}
                                </select>
                                <div className="h-64 -ml-4">
                                    {trendData.length > 1 ? (
                                        <ResponsiveContainer width="100%" height="100%">
                                            <AreaChart data={trendData}>
                                                <defs>
                                                    <linearGradient id="colorWeight" x1="0" y1="0" x2="0" y2="1">
                                                        <stop offset="5%" stopColor="#3b82f6" stopOpacity={0.3}/>
                                                        <stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/>
                                                    </linearGradient>
                                                </defs>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#1e293b" />
                                                <XAxis dataKey="date" fontSize={10} tick={{fill: '#64748b'}} axisLine={false} tickLine={false} />
                                                <YAxis fontSize={10} tick={{fill: '#64748b'}} domain={['auto', 'auto']} axisLine={false} tickLine={false} />
                                                <Tooltip contentStyle={{backgroundColor: '#0f172a', border: '1px solid #1e293b', borderRadius: '12px', fontSize: '10px'}} />
                                                <Area type="monotone" dataKey="weight" stroke="#3b82f6" fill="url(#colorWeight)" strokeWidth={4} dot={{r: 4, fill: '#3b82f6'}} />
                                            </AreaChart>
                                        </ResponsiveContainer>
                                    ) : <p className="text-center text-slate-600 py-20 text-xs">Need 2+ logs to show trends</p>}
                                </div>
                            </div>
                        )}
                    </main>
                    <script>{setTimeout(() => { if(window.lucide) lucide.createIcons(); }, 500)}<\/script>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
