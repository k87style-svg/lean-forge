<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEAN FORGE | Training Log</title>
    <!-- 外部スクリプトにcrossoriginを追加して詳細なエラーが見えるように修正 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js" crossorigin></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js" crossorigin></script>
    <script src="https://unpkg.com/lucide@latest" crossorigin></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #020617; color: #f8fafc; margin: 0; }
        .error-overlay { position: fixed; inset: 0; background: #991b1b; color: white; padding: 30px; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .error-card { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.2); width: 100%; max-width: 450px; text-align: left; }
        .code-font { font-family: 'Courier New', Courier, monospace; font-size: 12px; word-break: break-all; color: #fca5a5; }
    </style>
</head>
<body>
    <div id="root">
        <div class="flex flex-col items-center justify-center h-screen p-10 text-center animate-pulse">
            <div id="spinner" class="animate-spin rounded-full h-14 w-14 border-t-2 border-blue-500 mb-8"></div>
            <h1 class="text-4xl font-black italic tracking-tighter mb-4">LEAN FORGE</h1>
            <p id="status-text" class="text-xs font-bold text-slate-500 uppercase tracking-[0.4em]">Initializing Core Engine...</p>
        </div>
    </div>

    <!-- システムタグ -->
    <div style="position: fixed; bottom: 10px; left: 10px; font-size: 9px; font-weight: 900; color: #3b82f6; z-index: 100; opacity: 0.5;">
        DEBUG_MODE: ON | BUILD_v1.9
    </div>

    <script>
        // エラーハンドラーを最初に配置
        window.onerror = function(msg, url, line, col, error) {
            const status = document.getElementById('status-text');
            if (status) status.textContent = "BOOT HALTED";
            
            document.body.innerHTML = `
                <div class="error-overlay">
                    <h2 class="text-3xl font-black italic mb-6">❌ SYSTEM ERROR</h2>
                    <div class="error-card">
                        <p class="text-sm font-bold mb-4">健兄、エラーの本当の内容が見つかったよ：</p>
                        <div class="code-font bg-black/30 p-4 rounded-lg mb-4">
                            MESSAGE: ${msg}<br>
                            LOCATION: ${line}行目付近<br>
                            DETAILS: ${error ? error.stack.split('\\n')[0] : 'No stack trace'}
                        </div>
                        <p class="text-[10px] text-white/70 leading-relaxed uppercase">
                            💡 もしこれが 'Script error' なら、ネットの接続が不安定か広告ブロックが原因の可能性があるよ。具体的なメッセージが出ているなら、それをポラリスに教えて！
                        </p>
                    </div>
                    <button onclick="location.reload()" class="mt-8 px-12 py-4 bg-white text-red-800 rounded-2xl font-black shadow-2xl active:scale-95 transition-all uppercase tracking-widest text-sm">Retry Forge</button>
                </div>
            `;
            return false;
        };
    </script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, Timestamp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        // ==========================================================
        // ⚠️ 健兄、ここを自分の設定に正確に書き換えてください
        // ==========================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD8VBTTCCVIWmYrTy4RuDDraF86ekx6Yw8",
            authDomain: "lean-forge-20de1.firebaseapp.com",
            projectId: "lean-forge-20de1",
            storageBucket: "lean-forge-20de1.firebasestorage.app",
            messagingSenderId: "109377469954",
            appId: "1:109377469954:web:7023e6918e58e31b3fb11b"
        };
        // ==========================================================

        if (firebaseConfig.apiKey === "YOUR_API_KEY") {
            window.onerror("APIキーが初期状態のままです。コードを書き換えてね！", "", 0);
        } else {
            try {
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const auth = getAuth(app);
                window.firebaseData = { db, auth, collection, addDoc, onSnapshot, query, Timestamp, signInAnonymously, onAuthStateChanged };
                console.log("Firebase OK");
            } catch (e) {
                window.onerror("Firebase初期化失敗: " + e.message, "", 0);
            }
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, AreaChart, Area } = Recharts;
        const { Activity, Calendar, Dumbbell, Trophy, TrendingUp } = lucide;

        const MACHINE_LIST = [
            "ショルダープレス", "ペクトラル", "レッグエクステンション", "レッグカール",
            "チェストプレス", "ローワーバック", "アブダクター", "アダクター",
            "ローロー", "レッグプレス", "トータルアブドミナル", "ロータリートルソー",
            "マルチヒップ", "ラットマシン", "スミスマシン・ベンチプレス", "スミスマシン・スクワット",
            "ダンベル・フライ", "ダンベル・サイドレイズ", "ワンハンド・ローイング"
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [logs, setLogs] = useState([]);
            const [selectedMachine, setSelectedMachine] = useState(MACHINE_LIST[0]);
            const [weight, setWeight] = useState(20);
            const [reps, setReps] = useState(10);
            const [sets, setSets] = useState(3);
            const [view, setView] = useState('input');
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                let timer = 0;
                const checkInterval = setInterval(() => {
                    timer += 500;
                    if (window.firebaseData) {
                        const { auth, signInAnonymously, onAuthStateChanged } = window.firebaseData;
                        signInAnonymously(auth).catch(err => setError("Firebaseの『匿名認証』を有効にしてください"));
                        onAuthStateChanged(auth, (u) => {
                            if (u) { setUser(u); setLoading(false); clearInterval(checkInterval); }
                        });
                    }
                    if (timer > 20000) { setError("サーバーの応答がありません。ネットワーク環境を確認してください。"); clearInterval(checkInterval); }
                }, 500);
                return () => clearInterval(checkInterval);
            }, []);

            useEffect(() => {
                if (!user || !window.firebaseData) return;
                const { db, collection, onSnapshot } = window.firebaseData;
                const q = collection(db, 'training_logs_' + user.uid);
                return onSnapshot(q, (s) => {
                    setLogs(s.docs.map(d => ({id: d.id, ...d.data(), date: d.data().date?.toDate() || new Date()})).sort((a, b) => b.date - a.date));
                }, (err) => setError("データベース接続エラー: " + err.message));
            }, [user]);

            const handleSave = async () => {
                const { db, collection, addDoc, Timestamp } = window.firebaseData;
                await addDoc(collection(db, 'training_logs_' + user.uid), {
                    machineName: selectedMachine, weight: Number(weight), reps: Number(reps), sets: Number(sets), date: Timestamp.now()
                });
                setView('history');
            };

            const trendData = useMemo(() => logs.filter(l => l.machineName === selectedMachine).sort((a,b)=>a.date-b.date).map(l=>({date: l.date.toLocaleDateString('ja-JP',{month:'2-digit',day:'2-digit'}), weight: l.weight})), [logs, selectedMachine]);

            if (error) return <div className="h-screen flex items-center justify-center p-10 text-red-500 font-black uppercase text-center text-xs leading-loose bg-slate-950 italic">{error}</div>;
            if (loading) return null;

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 pb-24 px-4 font-sans animate-in">
                    <header className="py-8 flex justify-between items-center max-w-md mx-auto">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2.5 rounded-xl shadow-lg"><Activity size={24} className="text-white" /></div>
                            <div>
                                <h1 className="text-2xl font-black tracking-tighter italic uppercase">Lean Forge</h1>
                                <p className="text-[10px] text-slate-500 font-bold tracking-[0.3em] uppercase">The Aesthetic Log</p>
                            </div>
                        </div>
                    </header>

                    <nav className="max-w-md mx-auto mb-8 flex bg-slate-900 rounded-2xl p-1.5 border border-slate-800">
                        {['input', 'history', 'trends'].map(t => (
                            <button key={t} onClick={() => setView(t)} className={`flex-1 py-3.5 rounded-xl text-xs font-black uppercase tracking-widest ${view === t ? 'bg-blue-600 text-white shadow-xl shadow-blue-900/40' : 'text-slate-500'}`}>
                                {t === 'input' ? 'Log' : t === 'history' ? 'History' : 'Trends'}
                            </button>
                        ))}
                    </nav>

                    <main className="max-w-md mx-auto space-y-6">
                        {view === 'input' && (
                            <div className="bg-slate-900 rounded-[2.5rem] p-8 border border-slate-800 shadow-2xl space-y-7 animate-in">
                                <div>
                                    <label className="text-[9px] text-slate-500 uppercase font-black mb-3 block tracking-widest ml-1">Select Machine</label>
                                    <select value={selectedMachine} onChange={e => setSelectedMachine(e.target.value)} className="w-full p-4.5 bg-slate-800 rounded-2xl border border-slate-700 font-bold text-slate-200 outline-none focus:border-blue-500">
                                        {MACHINE_LIST.map(m => <option key={m}>{m}</option>)}
                                    </select>
                                </div>
                                <div className="grid grid-cols-3 gap-4">
                                    {[{l:'Kg', v:weight, s:setWeight}, {l:'Reps', v:reps, s:setReps}, {l:'Sets', v:sets, s:setSets}].map(f => (
                                        <div key={f.l} className="text-center">
                                            <label className="text-[9px] text-slate-500 uppercase font-black mb-3 block">{f.l}</label>
                                            <input type="number" step={f.l==='Kg'?0.5:1} value={f.v} onChange={e => f.s(e.target.value)} className="w-full p-4.5 bg-slate-800 rounded-2xl text-center font-black text-xl border border-slate-700 outline-none focus:border-blue-500" />
                                        </div>
                                    ))}
                                </div>
                                <button onClick={handleSave} className="w-full py-5.5 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl font-black text-white uppercase tracking-widest text-[13px] shadow-xl shadow-blue-900/30 active:scale-95 transition-all">Forge Progress</button>
                            </div>
                        )}

                        {view === 'history' && (
                            <div className="space-y-4 animate-in">
                                {logs.length === 0 ? <div className="text-center py-24 opacity-20 font-black text-[10px] tracking-[0.3em] uppercase">No Records Forge Yet</div> : logs.map(log => (
                                    <div key={log.id} className="bg-slate-900 p-5.5 rounded-3xl flex justify-between items-center border border-slate-800 hover:border-slate-700 transition-all shadow-xl shadow-black/20">
                                        <div>
                                            <div className="font-black text-slate-200">{log.machineName}</div>
                                            <div className="text-[9px] text-slate-500 font-black uppercase mt-1.5 flex items-center gap-1.5"><Calendar size={11} /> {log.date.toLocaleDateString()}</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="flex items-baseline justify-end"><span className="text-2xl font-black text-blue-500 tracking-tighter">{log.weight}</span><span className="text-[10px] text-slate-500 font-black ml-1 uppercase">kg</span></div>
                                            <div className="text-[11px] font-black text-slate-400 italic opacity-80">{log.reps}R × {log.sets}S</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {view === 'trends' && (
                            <div className="bg-slate-900 rounded-[2.5rem] p-8 border border-slate-800 shadow-2xl animate-in">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-[10px] text-slate-500 font-black uppercase tracking-widest ml-1">Growth Curve</h2>
                                    <Trophy size={16} className="text-yellow-500 opacity-80" />
                                </div>
                                <select value={selectedMachine} onChange={e => setSelectedMachine(e.target.value)} className="w-full p-4.5 bg-slate-800 rounded-2xl mb-10 border border-slate-700 font-black text-slate-200 outline-none">
                                    {MACHINE_LIST.map(m => <option key={m}>{m}</option>)}
                                </select>
                                <div className="h-64 -ml-4">
                                    {trendData.length > 1 ? (
                                        <ResponsiveContainer width="100%" height="100%">
                                            <AreaChart data={trendData}>
                                                <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#3b82f6" stopOpacity={0.3}/><stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/></linearGradient></defs>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#1e293b" />
                                                <XAxis dataKey="date" fontSize={10} tick={{fill:'#64748b'}} axisLine={false} tickLine={false} />
                                                <YAxis fontSize={10} tick={{fill:'#64748b'}} domain={['auto', 'auto']} axisLine={false} tickLine={false} />
                                                <Tooltip contentStyle={{backgroundColor: '#0f172a', border: '1px solid #1e293b', borderRadius: '16px', fontSize: '11px', fontWeight: 'bold'}} />
                                                <Area type="monotone" dataKey="weight" stroke="#3b82f6" fill="url(#g)" strokeWidth={4} dot={{r: 4, fill: '#3b82f6', strokeWidth: 0}} />
                                            </AreaChart>
                                        </ResponsiveContainer>
                                    ) : <div className="h-full flex flex-col items-center justify-center space-y-4 opacity-20"><TrendingUp size={32} /><p className="text-[10px] uppercase font-black tracking-widest text-center leading-loose">Analyzing progress...<br/>Log 2+ times to see the curve.</p></div>}
                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="text-center py-10 opacity-20">
                        <p className="text-[8px] font-black tracking-[0.5em] uppercase">Forged by Ken-nii & Polaris</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
