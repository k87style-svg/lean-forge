<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEAN FORGE | Training Log</title>
    <!-- ライブラリ読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #020617; color: #f8fafc; margin: 0; }
        select, input { color: white !important; background-color: #0f172a !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        var useState = React.useState;
        var useEffect = React.useEffect;
        var useMemo = React.useMemo;

        var MACHINE_LIST = ["ショルダープレス", "ペクトラル", "レッグエクステンション", "レッグカール", "チェストプレス", "ローワーバック", "アブダクター", "アダクター", "ローロー", "レッグプレス", "トータルアブドミナル", "ロータリートルソー", "マルチヒップ", "ラットマシン", "ベンチプレス", "スクワット", "ダンベルフライ", "サイドレイズ", "ワンハンドローイング"];

        function App() {
            var [logs, setLogs] = useState(function() {
                var saved = localStorage.getItem('lean_forge_logs');
                return saved ? JSON.parse(saved) : [];
            });
            var [selM, setSelM] = useState(MACHINE_LIST[0]);
            var [weight, setWeight] = useState(20);
            var [reps, setReps] = useState(10);
            var [sets, setSets] = useState(3);
            var [view, setView] = useState('input');

            // データの保存
            useEffect(function() {
                localStorage.setItem('lean_forge_logs', JSON.stringify(logs));
            }, [logs]);

            function save() {
                var newLog = {
                    id: Date.now(),
                    machineName: selM,
                    weight: Number(weight),
                    reps: Number(reps),
                    sets: Number(sets),
                    date: new Date().toISOString()
                };
                setLogs(function(prev) { return [newLog].concat(prev); });
                setView('history');
            }

            var tData = useMemo(function() {
                return logs.filter(function(l) { return l.machineName === selM; })
                    .sort(function(a, b) { return new Date(a.date) - new Date(b.date); })
                    .map(function(l) { 
                        return { 
                            date: new Date(l.date).toLocaleDateString('ja-JP', {month:'2-digit', day:'2-digit'}), 
                            weight: l.weight 
                        }; 
                    });
            }, [logs, selM]);

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 pb-24 px-4">
                    <header className="py-8 flex justify-between items-center max-w-md mx-auto">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2.5 rounded-xl shadow-lg shadow-blue-900/40 text-white">
                                <i className="fas fa-bolt text-xl"></i>
                            </div>
                            <div>
                                <h1 className="text-2xl font-black italic uppercase tracking-tighter">LEAN FORGE</h1>
                                <p className="text-[10px] text-slate-500 font-bold tracking-[0.3em] uppercase">Local Stable v4.0</p>
                            </div>
                        </div>
                    </header>

                    <nav className="max-w-md mx-auto mb-8 flex bg-slate-900 rounded-2xl p-1.5 border border-slate-800 shadow-2xl">
                        {['input', 'history', 'trends'].map(function(t) {
                            return (
                                <button key={t} onClick={function() { setView(t); }} className={"flex-1 py-3.5 rounded-xl text-xs font-black uppercase tracking-widest transition-all " + (view === t ? 'bg-blue-600 text-white' : 'text-slate-500')}>
                                    {t === 'input' ? 'Log' : t === 'history' ? 'History' : 'Trends'}
                                </button>
                            );
                        })}
                    </nav>

                    <main className="max-w-md mx-auto space-y-6">
                        {view === 'input' && (
                            <div className="bg-slate-900 rounded-[2.5rem] p-8 border border-slate-800 shadow-2xl space-y-7">
                                <div>
                                    <label className="text-[9px] text-slate-500 uppercase font-black mb-3 block tracking-widest ml-1">Select Machine</label>
                                    <select value={selM} onChange={function(e) { setSelM(e.target.value); }} className="w-full p-4.5 bg-slate-800 rounded-2xl border border-slate-700 font-bold text-white outline-none appearance-none">
                                        {MACHINE_LIST.map(function(m) { return <option key={m} value={m}>{m}</option>; })}
                                    </select>
                                </div>
                                <div className="grid grid-cols-3 gap-4">
                                    {[{l:'Kg', v:weight, s:setWeight}, {l:'Reps', v:reps, s:setReps}, {l:'Sets', v:sets, s:setSets}].map(function(f) {
                                        return (
                                            <div key={f.l} className="text-center">
                                                <label className="text-[9px] text-slate-500 uppercase font-black mb-3 block">{f.l}</label>
                                                <input type="number" step="0.5" value={f.v} onChange={function(e) { f.s(e.target.value); }} className="w-full p-4.5 bg-slate-800 rounded-2xl text-center font-black text-xl border border-slate-700 outline-none" />
                                            </div>
                                        );
                                    })}
                                </div>
                                <button onClick={save} className="w-full py-5.5 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl font-black text-white uppercase tracking-widest text-[13px] shadow-xl shadow-blue-900/50 active:scale-95 transition-all">Forge Progress</button>
                            </div>
                        )}

                        {view === 'history' && (
                            <div className="space-y-4">
                                {logs.length === 0 ? <div className="text-center py-24 opacity-20 font-black text-[10px] tracking-widest uppercase">No Records Yet</div> : logs.map(function(log) {
                                    return (
                                        <div key={log.id} className="bg-slate-900 p-5.5 rounded-3xl flex justify-between items-center border border-slate-800 shadow-xl">
                                            <div>
                                                <div className="font-black text-slate-200 text-[15px]">{log.machineName}</div>
                                                <div className="text-[9px] text-slate-500 font-black uppercase mt-1.5"><i className="far fa-calendar-alt mr-1"></i> {new Date(log.date).toLocaleDateString()}</div>
                                            </div>
                                            <div className="text-right">
                                                <div className="flex items-baseline justify-end">
                                                    <span className="text-2xl font-black text-blue-500 tracking-tighter">{log.weight}</span>
                                                    <span className="text-[10px] text-slate-500 font-black ml-1 uppercase">kg</span>
                                                </div>
                                                <div className="text-[11px] font-black text-slate-400 italic opacity-80">{log.reps}R × {log.sets}S</div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {view === 'trends' && (
                            <div className="bg-slate-900 rounded-[2.5rem] p-8 border border-slate-800 shadow-2xl">
                                <div className="flex justify-between items-center mb-7">
                                    <h2 className="text-[10px] text-slate-500 font-black uppercase tracking-widest ml-1">Growth Curve</h2>
                                    <i className="fas fa-trophy text-yellow-500 opacity-80"></i>
                                </div>
                                <select value={selM} onChange={function(e) { setSelM(e.target.value); }} className="w-full p-4.5 bg-slate-800 rounded-2xl mb-10 border border-slate-700 font-black text-white outline-none">
                                    {MACHINE_LIST.map(function(m) { return <option key={m} value={m}>{m}</option>; })}
                                </select>
                                <div className="h-64 -ml-4">
                                    {tData.length > 1 ? (
                                        <Recharts.ResponsiveContainer width="100%" height="100%">
                                            <Recharts.AreaChart data={tData}>
                                                <defs>
                                                    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
                                                        <stop offset="5%" stopColor="#3b82f6" stopOpacity={0.3}/>
                                                        <stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/>
                                                    </linearGradient>
                                                </defs>
                                                <Recharts.CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#1e293b" />
                                                <Recharts.XAxis dataKey="date" fontSize={10} tick={{fill:'#64748b'}} axisLine={false} tickLine={false} />
                                                <Recharts.YAxis fontSize={10} tick={{fill:'#64748b'}} domain={['auto', 'auto']} axisLine={false} tickLine={false} />
                                                <Recharts.Tooltip contentStyle={{backgroundColor: '#0f172a', border: 'none', borderRadius: '16px', color: '#fff'}} />
                                                <Recharts.Area type="monotone" dataKey="weight" stroke="#3b82f6" fill="url(#g)" strokeWidth={4} dot={{r: 4, fill: '#3b82f6', strokeWidth: 0}} />
                                            </Recharts.AreaChart>
                                        </Recharts.ResponsiveContainer>
                                    ) : <div className="h-full flex flex-col items-center justify-center space-y-4 opacity-20"><i className="fas fa-chart-line text-3xl"></i><p className="text-[10px] uppercase font-black tracking-widest text-center leading-loose">Need 2+ logs to see the forge curve.</p></div>}
                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="text-center py-12 opacity-20">
                        <p className="text-[8px] font-black tracking-[0.5em] uppercase italic">Offline Core v4.0 Active</p>
                    </footer>
                </div>
            );
        }

        var root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
