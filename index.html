<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEAN FORGE | Training Log</title>
    <!-- ライブラリ読み込み。crossoriginを付けてエラーを見えやすくします -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js" crossorigin></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js" crossorigin></script>
    <script src="https://unpkg.com/lucide@latest" crossorigin></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #020617; color: #f8fafc; margin: 0; }
        .error-overlay { position: fixed; inset: 0; background: #991b1b; color: white; padding: 30px; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .error-card { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.2); width: 100%; max-width: 450px; text-align: left; }
    </style>
</head>
<body>
    <div id="root">
        <!-- 起動待機画面 -->
        <div class="flex flex-col items-center justify-center h-screen p-10 text-center">
            <div id="spinner" class="animate-spin rounded-full h-14 w-14 border-t-2 border-blue-500 mb-8 shadow-lg shadow-blue-500/20"></div>
            <h1 class="text-4xl font-black italic tracking-tighter mb-4 uppercase">Lean Forge</h1>
            <p id="status-text" class="text-xs font-bold text-slate-500 uppercase tracking-[0.4em]">Waiting for System Assets...</p>
        </div>
    </div>

    <!-- システムタグ（v2.2が見えればOK） -->
    <div id="version-tag" style="position: fixed; bottom: 10px; left: 10px; font-size: 9px; font-weight: 900; color: #3b82f6; z-index: 100; opacity: 0.5;">
        ULTRA_COMPATIBLE: v2.2_FINAL_SET
    </div>

    <script>
        // エラーハンドラー
        window.onerror = function(msg, url, line) {
            document.body.innerHTML = '<div class="error-overlay"><h2 class="text-3xl font-black italic mb-6 uppercase">❌ Boot Error</h2><div class="error-card"><p class="text-sm font-bold mb-4 italic">健兄、まだエラーが出たよ：</p><p class="text-[12px] font-mono text-red-200 bg-black/40 p-4 rounded-lg">' + msg + '<br>LINE: ' + line + '</p><p class="mt-6 text-[10px] text-white/60 leading-relaxed uppercase">💡 これが出たら、スマホのブラウザ履歴を一度消して、開き直してみて！</p></div><button onclick="location.reload()" class="mt-8 px-12 py-4 bg-white text-red-800 rounded-2xl font-black uppercase text-sm shadow-2xl">Retry Forge</button></div>';
            return false;
        };
    </script>

    <!-- Firebase SDK (Module版) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, Timestamp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        // --- ⚠️ 健兄、ここを自分のFirebase設定に書き換えてください ---
        var firebaseConfig = {
            apiKey: "AIzaSyD8VBTTCCVIWmYrTy4RuDDraF86ekx6Yw8",
            authDomain: "lean-forge-20de1.firebaseapp.com",
            projectId: "lean-forge-20de1",
            storageBucket: "lean-forge-20de1.firebasestorage.app",
            messagingSenderId: "109377469954",
            appId: "1:109377469954:web:7023e6918e58e31b3fb11b"
        };
        // --------------------------------------------------------

        if (firebaseConfig.apiKey === "YOUR_API_KEY") {
            window.onerror("APIキーが初期状態です。コードを書き換えてね！", "", 0);
        } else {
            try {
                var app = initializeApp(firebaseConfig);
                var db = getFirestore(app);
                var auth = getAuth(app);
                window.firebaseData = {
                    db: db, auth: auth, collection: collection, addDoc: addDoc, 
                    onSnapshot: onSnapshot, query: query, Timestamp: Timestamp, 
                    signInAnonymously: signInAnonymously, onAuthStateChanged: onAuthStateChanged
                };
                console.log("Firebase OK");
            } catch (e) {
                window.onerror("Firebase Init Error: " + e.message, "", 0);
            }
        }
    </script>

    <!-- React App (徹底的に古いJSの書き方 = ES5 で構築) -->
    <script type="text/babel">
        // 徹底的に「=>」や「const」を排除し、安全な関数と変数の宣言を使用
        var useState = React.useState;
        var useEffect = React.useEffect;
        var useMemo = React.useMemo;

        var MACHINE_LIST = [
            "ショルダープレス", "ペクトラル", "レッグエクステンション", "レッグカール",
            "チェストプレス", "ローワーバック", "アブダクター", "アダクター",
            "ローロー", "レッグプレス", "トータルアブドミナル", "ロータリートルソー",
            "マルチヒップ", "ラットマシン", "スミスマシン・ベンチプレス", "スミスマシン・スクワット",
            "ダンベル・フライ", "ダンベル・サイドレイズ", "ワンハンド・ローイング"
        ];

        function App() {
            var [user, setUser] = useState(null);
            var [logs, setLogs] = useState([]);
            var [selectedMachine, setSelectedMachine] = useState(MACHINE_LIST[0]);
            var [weight, setWeight] = useState(20);
            var [reps, setReps] = useState(10);
            var [sets, setSets] = useState(3);
            var [view, setView] = useState('input');
            var [loading, setLoading] = useState(true);
            var [error, setError] = useState(null);

            // 依存ライブラリとFirebaseの準備を待つ
            useEffect(function() {
                var timer = 0;
                var checkInterval = setInterval(function() {
                    timer += 500;
                    // Recharts, Lucide, Firebaseすべてが揃うまで待つ
                    if (window.firebaseData && window.Recharts && window.lucide) {
                        var firebase = window.firebaseData;
                        firebase.signInAnonymously(firebase.auth)["catch"](function(err) {
                            setError("匿名認証エラー: コンソールで設定を確認してください");
                        });
                        firebase.onAuthStateChanged(firebase.auth, function(u) {
                            if (u) {
                                setUser(u);
                                setLoading(false);
                                clearInterval(checkInterval);
                            }
                        });
                    }
                    if (timer > 20000) {
                        setError("タイムアウト。ライブラリの読み込みに失敗しました。");
                        clearInterval(checkInterval);
                    }
                }, 500);
                return function() { clearInterval(checkInterval); };
            }, []);

            // データ取得 (最新の書き方を一切排除)
            useEffect(function() {
                if (!user || !window.firebaseData) return;
                var firebase = window.firebaseData;
                var q = firebase.collection(firebase.db, 'training_logs_' + user.uid);
                
                return firebase.onSnapshot(q, function(snapshot) {
                    var data = snapshot.docs.map(function(doc) {
                        var item = doc.data();
                        var dateValue = new Date();
                        if (item.date && item.date.toDate) {
                            dateValue = item.date.toDate();
                        }
                        var result = Object.assign({}, item);
                        result.id = doc.id;
                        result.date = dateValue;
                        return result;
                    });
                    setLogs(data.sort(function(a, b) { return b.date - a.date; }));
                }, function(err) {
                    setError("データベースエラー: " + err.message);
                });
            }, [user]);

            function handleSave() {
                if (!user || !window.firebaseData) return;
                var firebase = window.firebaseData;
                firebase.addDoc(firebase.collection(firebase.db, 'training_logs_' + user.uid), {
                    machineName: selectedMachine,
                    weight: Number(weight),
                    reps: Number(reps),
                    sets: Number(sets),
                    date: firebase.Timestamp.now()
                }).then(function() {
                    setView('history');
                })["catch"](function(e) {
                    alert("保存エラー: " + e.message);
                });
            }

            var trendData = useMemo(function() {
                var filtered = logs.filter(function(l) { return l.machineName === selectedMachine; });
                var sorted = filtered.sort(function(a, b) { return a.date - b.date; });
                return sorted.map(function(l) { 
                    return {
                        date: l.date.toLocaleDateString('ja-JP', {month:'2-digit', day:'2-digit'}), 
                        weight: l.weight
                    };
                });
            }, [logs, selectedMachine]);

            if (error) return <div className="h-screen flex items-center justify-center p-10 text-red-500 font-black uppercase text-center text-[10px] bg-slate-950 italic">{error}</div>;
            if (loading) return null;

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 pb-24 px-4 font-sans animate-in">
                    <header className="py-8 flex justify-between items-center max-w-md mx-auto">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2.5 rounded-xl shadow-lg"><lucide.Activity size={24} /></div>
                            <div>
                                <h1 className="text-2xl font-black tracking-tighter italic uppercase">Lean Forge</h1>
                                <p className="text-[10px] text-slate-500 font-bold tracking-[0.3em] uppercase">The Aesthetic Log</p>
                            </div>
                        </div>
                    </header>

                    <nav className="max-w-md mx-auto mb-8 flex bg-slate-900 rounded-2xl p-1.5 border border-slate-800">
                        {['input', 'history', 'trends'].map(function(t) {
                            return (
                                <button key={t} onClick={function() { setView(t); }} className={"flex-1 py-3.5 rounded-xl text-xs font-black uppercase tracking-widest transition-all " + (view === t ? 'bg-blue-600 text-white shadow-xl' : 'text-slate-500')}>
                                    {t === 'input' ? 'Log' : t === 'history' ? 'History' : 'Trends'}
                                </button>
                            );
                        })}
                    </nav>

                    <main className="max-w-md mx-auto space-y-6">
                        {view === 'input' && (
                            <div className="bg-slate-900 rounded-[2.5rem] p-8 border border-slate-800 shadow-2xl space-y-7 animate-in">
                                <div>
                                    <label className="text-[9px] text-slate-500 uppercase font-black mb-3 block tracking-widest">Select Machine</label>
                                    <select value={selectedMachine} onChange={function(e) { setSelectedMachine(e.target.value); }} className="w-full p-4.5 bg-slate-800 rounded-2xl border border-slate-700 font-bold text-slate-200 outline-none appearance-none">
                                        {MACHINE_LIST.map(function(m) { return <option key={m} value={m}>{m}</option>; })}
                                    </select>
                                </div>
                                <div className="grid grid-cols-3 gap-4">
                                    <div className="text-center">
                                        <label className="text-[9px] text-slate-500 uppercase font-black mb-3 block">Kg</label>
                                        <input type="number" step="0.5" value={weight} onChange={function(e) { setWeight(e.target.value); }} className="w-full p-4 bg-slate-800 rounded-2xl text-center font-black text-xl border border-slate-700 outline-none" />
                                    </div>
                                    <div className="text-center">
                                        <label className="text-[9px] text-slate-500 uppercase font-black mb-3 block">Reps</label>
                                        <input type="number" value={reps} onChange={function(e) { setReps(e.target.value); }} className="w-full p-4 bg-slate-800 rounded-2xl text-center font-black text-xl border border-slate-700 outline-none" />
                                    </div>
                                    <div className="text-center">
                                        <label className="text-[9px] text-slate-500 uppercase font-black mb-3 block">Sets</label>
                                        <input type="number" value={sets} onChange={function(e) { setSets(e.target.value); }} className="w-full p-4 bg-slate-800 rounded-2xl text-center font-black text-xl border border-slate-700 outline-none" />
                                    </div>
                                </div>
                                <button onClick={handleSave} className="w-full py-5 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl font-black text-white uppercase tracking-widest text-[13px] shadow-xl shadow-blue-900/40 active:scale-95 transition-all">Forge Progress</button>
                            </div>
                        )}

                        {view === 'history' && (
                            <div className="space-y-4 animate-in">
                                {logs.length === 0 ? <div className="text-center py-24 opacity-20 font-black text-[10px] tracking-widest uppercase">No Records</div> : logs.map(function(log) {
                                    return (
                                        <div key={log.id} className="bg-slate-900 p-5.5 rounded-3xl flex justify-between items-center border border-slate-800 shadow-xl shadow-black/20">
                                            <div>
                                                <div className="font-black text-slate-200 text-sm">{log.machineName}</div>
                                                <div className="text-[9px] text-slate-500 font-black uppercase mt-1.5 flex items-center gap-1.5"><lucide.Calendar size={11} /> {log.date.toLocaleDateString()}</div>
                                            </div>
                                            <div className="text-right">
                                                <div className="flex items-baseline justify-end"><span className="text-2xl font-black text-blue-500 tracking-tighter">{log.weight}</span><span className="text-[10px] text-slate-500 font-black ml-1 uppercase">kg</span></div>
                                                <div className="text-[11px] font-black text-slate-400 italic opacity-80">{log.reps}R × {log.sets}S</div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {view === 'trends' && (
                            <div className="bg-slate-900 rounded-[2.5rem] p-8 border border-slate-800 shadow-2xl animate-in">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-[10px] text-slate-500 font-black uppercase tracking-widest ml-1">Growth Curve</h2>
                                    <lucide.Trophy size={16} className="text-yellow-500 opacity-80" />
                                </div>
                                <select value={selectedMachine} onChange={function(e) { setSelectedMachine(e.target.value); }} className="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 font-black text-slate-200 outline-none mb-6">
                                    {MACHINE_LIST.map(function(m) { return <option key={m} value={m}>{m}</option>; })}
                                </select>
                                <div className="h-64 -ml-4">
                                    {trendData.length > 1 ? (
                                        <Recharts.ResponsiveContainer width="100%" height="100%">
                                            <Recharts.AreaChart data={trendData}>
                                                <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#3b82f6" stopOpacity={0.3}/><stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/></linearGradient></defs>
                                                <Recharts.CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#1e293b" />
                                                <Recharts.XAxis dataKey="date" fontSize={10} tick={{fill:'#64748b'}} axisLine={false} tickLine={false} />
                                                <Recharts.YAxis fontSize={10} tick={{fill:'#64748b'}} domain={['auto', 'auto']} axisLine={false} tickLine={false} />
                                                <Recharts.Tooltip contentStyle={{backgroundColor: '#0f172a', border: '1px solid #1e293b', borderRadius: '16px'}} />
                                                <Recharts.Area type="monotone" dataKey="weight" stroke="#3b82f6" fill="url(#g)" strokeWidth={4} dot={{r: 4, fill: '#3b82f6'}} />
                                            </Recharts.AreaChart>
                                        </Recharts.ResponsiveContainer>
                                    ) : <div className="h-full flex flex-col items-center justify-center opacity-20"><lucide.TrendingUp size={32} /><p className="text-[9px] uppercase font-black tracking-widest mt-4">Need 2+ Logs</p></div>}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // 読み込み完了を待ってからレンダリング
        var renderTimer = setInterval(function() {
            if (window.ReactDOM && window.React && window.Recharts && window.lucide) {
                clearInterval(renderTimer);
                var root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(React.createElement(App));
            }
        }, 100);
    </script>
</body>
</html>
