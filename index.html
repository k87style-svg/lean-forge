<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEAN FORGE | Setup-Free v10.0</title>
    
    <!-- ステータスボードと同じライブラリ構成 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    
    <!-- Firebase SDK (Compat版) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', "Meiryo", sans-serif; background-color: #020617; color: #f8fafc; margin: 0; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .active-tab { background-color: #2563eb; color: white; border-color: #3b82f6; }
        select, input { background-color: #0f172a !important; color: white !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 定数設定 ---
        const MACHINE_LIST = ["ショルダープレス", "ペクトラル", "レッグエクステンション", "レッグカール", "チェストプレス", "ローワーバック", "アブダクター", "アダクター", "ローロー", "レッグプレス", "トータルアブドミナル", "ロータリートルソー", "マルチヒップ", "ラットマシン", "ベンチプレス", "スクワット", "ダンベルフライ", "サイドレイズ", "ワンハンドローイング"];
        const START_DATE = new Date("2026-05-18");
        const END_DATE = new Date("2026-08-31");

        function App() {
            // 状態管理
            const [config, setConfig] = useState(() => {
                const saved = localStorage.getItem('lean_forge_fb_config');
                return saved ? JSON.parse(saved) : null;
            });
            const [isInitialized, setIsInitialized] = useState(false);
            const [user, setUser] = useState(null);
            const [logs, setLogs] = useState([]);
            const [view, setView] = useState('input');
            const [selM, setSelM] = useState(MACHINE_LIST[0]);
            const [weight, setWeight] = useState(20);
            const [reps, setReps] = useState(10);
            const [sets, setSets] = useState(3);
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);

            const showToast = (text, isError = false) => {
                setToast({ text, isError });
                setTimeout(() => setToast(null), 3000);
            };

            // Firebaseの動的初期化
            useEffect(() => {
                if (!config) return;

                try {
                    if (!firebase.apps.length) {
                        firebase.initializeApp(config);
                    }
                    const auth = firebase.auth();
                    const db = firebase.firestore();
                    
                    const initAuth = async () => {
                        try {
                            await auth.signInAnonymously();
                        } catch (e) { showToast("接続エラー: " + e.message, true); }
                    };
                    initAuth();

                    const unsubscribeAuth = auth.onAuthStateChanged((u) => {
                        setUser(u);
                        setIsInitialized(true);
                    });

                    return () => unsubscribeAuth();
                } catch (e) {
                    showToast("初期化に失敗しました。設定を確認してください。", true);
                    setConfig(null);
                }
            }, [config]);

            // データ購読
            useEffect(() => {
                if (!isInitialized || !user) return;
                const db = firebase.firestore();
                const appId = config.projectId || 'lean-forge';
                const path = `artifacts/${appId}/public/data/training_logs`;
                
                const unsubscribe = db.collection(path).onSnapshot(snapshot => {
                    const data = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data(),
                        date: doc.data().date?.toDate() || new Date()
                    }));
                    setLogs(data.sort((a, b) => b.date - a.date));
                }, err => showToast("同期エラー", true));
                
                return () => unsubscribe();
            }, [isInitialized, user]);

            // 設定保存
            const handleConfigSubmit = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const newConfig = {
                    apiKey: formData.get('apiKey'),
                    authDomain: formData.get('authDomain'),
                    projectId: formData.get('projectId'),
                    storageBucket: formData.get('storageBucket'),
                    messagingSenderId: formData.get('messagingSenderId'),
                    appId: formData.get('appId')
                };
                localStorage.setItem('lean_forge_fb_config', JSON.stringify(newConfig));
                setConfig(newConfig);
            };

            // 記録保存
            const handleSave = async () => {
                if (!user) return;
                setLoading(true);
                try {
                    const db = firebase.firestore();
                    const appId = config.projectId || 'lean-forge';
                    const path = `artifacts/${appId}/public/data/training_logs`;
                    await db.collection(path).add({
                        machineName: selM,
                        weight: Number(weight),
                        reps: Number(reps),
                        sets: Number(sets),
                        date: firebase.firestore.Timestamp.now(),
                        userId: user.uid
                    });
                    showToast("✅ 保存完了");
                    setView('history');
                } catch (e) {
                    showToast("保存失敗", true);
                } finally {
                    setLoading(false);
                }
            };

            const chartData = useMemo(() => {
                const filtered = logs.filter(l => l.machineName === selM).sort((a, b) => a.date - b.date);
                if (filtered.length === 0) return [];
                const startW = Number(filtered[0].weight);
                const targetW = startW * 1.2;
                const totalD = (END_DATE - START_DATE) / 86400000;
                return filtered.map(l => {
                    const d = (new Date(l.date) - START_DATE) / 86400000;
                    return { 
                        date: l.date.toLocaleDateString('ja-JP', {month:'2-digit', day:'2-digit'}), 
                        real: Number(l.weight), 
                        ideal: Math.round((startW + (targetW - startW) * (Math.max(0, d) / totalD)) * 10) / 10 
                    };
                });
            }, [logs, selM]);

            // --- 画面描画: 設定入力 ---
            if (!config) {
                return (
                    <div className="min-h-screen p-6 bg-slate-950 flex flex-col justify-center items-center">
                        <div className="w-full max-w-md bg-slate-900 rounded-[2.5rem] p-8 border border-slate-800 shadow-2xl animate-in">
                            <h2 className="text-2xl font-black mb-6 text-blue-500 italic uppercase">Cloud Setup</h2>
                            <p className="text-xs text-slate-500 mb-8 leading-relaxed font-bold uppercase tracking-widest">Firebaseの6項目を入力してください。設定はブラウザに保存されます。</p>
                            <form onSubmit={handleConfigSubmit} className="space-y-4">
                                {['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'].map(key => (
                                    <div key={key}>
                                        <label className="text-[9px] text-slate-500 uppercase font-black mb-1.5 block tracking-tighter">{key}</label>
                                        <input name={key} type="text" required className="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 text-sm outline-none font-mono" placeholder={`Enter ${key}...`} />
                                    </div>
                                ))}
                                <button type="submit" className="w-full py-5 bg-blue-600 rounded-2xl font-black text-white uppercase tracking-widest shadow-xl shadow-blue-900/40 mt-6 active:scale-95 transition-all">Connect & Start</button>
                            </form>
                        </div>
                    </div>
                );
            }

            // --- 画面描画: 接続待ち ---
            if (!isInitialized) {
                return (
                    <div className="flex flex-col items-center justify-center h-screen bg-slate-950">
                        <div className="w-10 h-10 border-4 border-slate-800 border-b-blue-600 rounded-full animate-spin"></div>
                        <p className="mt-4 text-blue-500 font-black tracking-widest text-xs uppercase">Connecting Cloud...</p>
                    </div>
                );
            }

            // --- 画面描画: メインアプリ ---
            return (
                <div className="min-h-screen pb-24 px-4 max-w-md mx-auto animate-in bg-slate-950">
                    {toast && (
                        <div className={`fixed bottom-10 left-1/2 -translate-x-1/2 z-50 p-4 rounded-2xl shadow-2xl border text-xs font-bold flex items-center gap-3 ${toast.isError ? 'bg-red-900 border-red-500' : 'bg-blue-900 border-blue-500'}`}>
                            {toast.text}
                        </div>
                    )}

                    <header className="py-8 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg"><i className="fas fa-bolt text-xl"></i></div>
                            <div>
                                <h1 className="text-2xl font-black italic uppercase tracking-tighter">LEAN FORGE</h1>
                                <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest text-blue-400">v10.0 Cloud Edition</p>
                            </div>
                        </div>
                        <button onClick={() => { if(confirm('設定をリセットしますか？')) { localStorage.removeItem('lean_forge_fb_config'); window.location.reload(); } }} className="text-slate-700 hover:text-red-500 transition-colors">
                            <i className="fas fa-cog"></i>
                        </button>
                    </header>

                    <nav className="mb-6 flex bg-slate-900 rounded-2xl p-1.5 border border-slate-800 shadow-xl overflow-x-auto no-scrollbar">
                        {[{id:'input', label:'記録'}, {id:'history', label:'履歴'}, {id:'trends', label:'推移'}].map(t => (
                            <button key={t.id} onClick={() => setView(t.id)} className={"flex-1 py-3 px-1 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all " + (view === t.id ? 'active-tab shadow-lg shadow-blue-900/20' : 'text-slate-500')}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <main>
                        {view === 'input' && (
                            <div className="bg-slate-900 rounded-[2.5rem] p-8 border border-slate-800 space-y-7 shadow-2xl">
                                <select value={selM} onChange={e => setSelM(e.target.value)} className="w-full p-4.5 bg-slate-800 rounded-2xl border border-slate-700 font-bold outline-none appearance-none">
                                    {MACHINE_LIST.map(m => <option key={m} value={m}>{m}</option>)}
                                </select>
                                <div className="grid grid-cols-3 gap-4">
                                    {[{l:'Kg', v:weight, s:setWeight}, {l:'Reps', v:reps, s:setReps}, {l:'Sets', v:sets, s:setSets}].map(f => (
                                        <div key={f.l} className="text-center">
                                            <label className="text-[9px] text-slate-500 uppercase font-black mb-2 block tracking-widest">{f.l}</label>
                                            <input type="number" step="0.5" value={f.v} onChange={e => f.s(e.target.value)} className="w-full p-4 bg-slate-800 rounded-2xl text-center font-black text-lg border border-slate-700 outline-none" />
                                        </div>
                                    ))}
                                </div>
                                <button onClick={handleSave} disabled={loading} className="w-full py-5.5 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl font-black text-white uppercase tracking-widest shadow-xl shadow-blue-900/50 active:scale-[0.98] transition-all">
                                    {loading ? 'SAVING...' : 'RECORD & FORGE'}
                                </button>
                            </div>
                        )}

                        {view === 'history' && (
                            <div className="space-y-4">
                                {logs.length === 0 ? <div className="text-center py-24 opacity-20 font-black text-[10px] uppercase tracking-widest text-slate-500">No cloud records</div> : logs.map(log => (
                                    <div key={log.id} className="bg-slate-900 p-6 rounded-[2rem] flex justify-between items-center border border-slate-800 shadow-xl">
                                        <div><div className="font-black text-slate-200 text-[14px]">{log.machineName}</div><div className="text-[9px] text-slate-500 font-black mt-2 uppercase tracking-widest">{log.date.toLocaleDateString()}</div></div>
                                        <div className="text-right"><div className="flex items-baseline justify-end"><span className="text-2xl font-black text-blue-500 tracking-tighter">{log.weight}</span><span className="text-[10px] text-slate-500 ml-1 uppercase">kg</span></div><div className="text-[11px] font-black text-slate-400 italic opacity-80">{log.reps}R × {log.sets}S</div></div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {view === 'trends' && (
                            <div className="bg-slate-900 rounded-[2.5rem] p-8 border border-slate-800 shadow-2xl space-y-6">
                                <h2 className="text-[10px] text-slate-500 font-black uppercase tracking-widest ml-1 text-blue-400">Growth Path</h2>
                                <select value={selM} onChange={e => setSelM(e.target.value)} className="w-full p-4 bg-slate-800 rounded-2xl border border-slate-700 font-black text-white outline-none">
                                    {MACHINE_LIST.map(m => <option key={m} value={m}>{m}</option>)}
                                </select>
                                <div className="h-72 -ml-4">
                                    {chartData.length >= 1 ? (
                                        <Recharts.ResponsiveContainer width="100%" height="100%">
                                            <Recharts.ComposedChart data={chartData}>
                                                <defs><linearGradient id="rG" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#3b82f6" stopOpacity={0.4}/><stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/></linearGradient></defs>
                                                <Recharts.CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#1e293b" /><Recharts.XAxis dataKey="date" fontSize={10} tick={{fill:'#64748b'}} axisLine={false} tickLine={false} /><Recharts.YAxis fontSize={10} tick={{fill:'#64748b'}} domain={['auto', 'auto']} axisLine={false} tickLine={false} />
                                                <Recharts.Area type="monotone" dataKey="real" stroke="#3b82f6" fill="url(#rG)" strokeWidth={4} dot={{r: 4, fill: '#3b82f6'}} />
                                                <Recharts.Line type="monotone" dataKey="ideal" stroke="#475569" strokeWidth={2} strokeDasharray="5 5" dot={false} />
                                            </Recharts.ComposedChart>
                                        </Recharts.ResponsiveContainer>
                                    ) : <div className="h-full flex flex-col items-center justify-center opacity-20 text-center"><i className="fas fa-chart-line text-4xl mb-2 text-slate-800"></i><p className="text-[10px] uppercase font-black tracking-widest leading-loose text-slate-600">Need records for analysis.</p></div>}
                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="text-center py-12 opacity-20"><p className="text-[8px] font-black tracking-[0.5em] uppercase italic text-slate-500">Strong Mind, Strong Body</p></footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
