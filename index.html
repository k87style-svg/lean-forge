<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEAN FORGE | Visual Sync v6.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #020617; color: #f8fafc; margin: 0; overflow-x: hidden; }
        select, input { color: white !important; background-color: #0f172a !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-tab { background-color: #2563eb; color: white; border-color: #3b82f6; }
        .animate-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const START_DATE = new Date("2026-05-18");
        const END_DATE = new Date("2026-08-31");
        const MACHINE_LIST = ["ショルダープレス", "ペクトラル", "レッグエクステンション", "レッグカール", "チェストプレス", "ローワーバック", "アブダクター", "アダクター", "ローロー", "レッグプレス", "トータルアブドミナル", "ロータリートルソー", "マルチヒップ", "ラットマシン", "ベンチプレス", "スクワット", "ダンベルフライ", "サイドレイズ", "ワンハンドローイング"];
        const ROUTINE = [
            { day: "Day A", title: "胸・肩・腕 (Push)", items: ["チェストプレス", "ペクトラル", "ショルダープレス", "サイドレイズ", "ベンチプレス", "ダンベルフライ"] },
            { day: "Day B", title: "背中・腕裏 (Pull)", items: ["ラットマシン", "ローロー", "ローワーバック", "ロータリートルソー"] },
            { day: "Day C", title: "足・腹筋 (Legs/Abs)", items: ["レッグプレス", "レッグエクステンション", "レッグカール", "トータルアブドミナル", "マルチヒップ", "アダクター", "アブダクター"] }
        ];

        function App() {
            const [config, setConfig] = useState(() => {
                try {
                    const saved = localStorage.getItem('lean_forge_config');
                    return saved ? JSON.parse(saved) : { token: "", owner: "k87style-svg", repo: "LEAN-FORGE", path: "data/training_logs.json" };
                } catch (e) {
                    return { token: "", owner: "k87style-svg", repo: "LEAN-FORGE", path: "data/training_logs.json" };
                }
            });
            const [logs, setLogs] = useState([]);
            const [selM, setSelM] = useState(MACHINE_LIST[0]);
            const [weight, setWeight] = useState(20);
            const [reps, setReps] = useState(10);
            const [sets, setSets] = useState(3);
            const [view, setView] = useState(config.token ? 'input' : 'settings');
            const [loading, setLoading] = useState(false);
            const [fileSha, setFileSha] = useState(null);

            useEffect(() => {
                if (config.token && config.owner && config.repo) {
                    loadData();
                }
            }, []);

            // 認証ヘッダーの生成（Classic TokenとFine-grained両対応）
            const getAuthHeader = (token) => {
                const clean = token.trim().replace(/^token\s+/i, '').replace(/^Bearer\s+/i, '');
                // Classic Token (ghp_) は 'token '、Fine-grained (github_pat_) は 'Bearer ' が推奨されるが、現状のAPIでは 'token ' が最も安定している
                const prefix = token.startsWith('github_pat_') ? 'Bearer ' : 'token ';
                return prefix + clean;
            };

            const loadData = async (overrideConfig) => {
                const c = overrideConfig || config;
                if (!c.token || !c.owner || !c.repo) return;
                
                setLoading(true);
                const url = "https://api.github.com/repos/" + c.owner + "/" + c.repo + "/contents/" + c.path;
                
                try {
                    const res = await fetch(url, {
                        headers: { 
                            "Accept": "application/vnd.github+json",
                            "Authorization": getAuthHeader(c.token),
                            "Cache-Control": "no-cache"
                        }
                    });
                    
                    if (res.status === 401) throw new Error("401: トークンが正しくありません。再発行が必要かもしれません。");
                    if (res.status === 403) throw new Error("403: アクセス拒否。トークンの権限（repo または Contents: Read）がありません。");
                    if (res.status === 404) {
                        setLogs([]);
                        setFileSha(null);
                        return true;
                    }
                    if (!res.ok) throw new Error(res.status + ": " + res.statusText);

                    const data = await res.json();
                    if (data.content) {
                        const decoded = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\s/g, '')))));
                        setLogs(Array.isArray(decoded) ? decoded : []);
                        setFileSha(data.sha);
                    }
                    return true;
                } catch (err) {
                    alert("【読込エラー】\n" + err.message);
                    setView('settings');
                    return false;
                } finally {
                    setLoading(false);
                }
            };

            const testConnection = async () => {
                setLoading(true);
                try {
                    const res = await fetch("https://api.github.com/zen", {
                        headers: { "Authorization": getAuthHeader(config.token) }
                    });
                    if (res.ok) {
                        const text = await res.text();
                        alert("✅ 通信成功！\n格言: " + text + "\n\n接続は完璧です！設定を保存して、最初の記録を開始しましょう！");
                    } else {
                        throw new Error("HTTP " + res.status);
                    }
                } catch (e) {
                    alert("❌ 接続失敗\n" + e.message);
                } finally {
                    setLoading(false);
                }
            };

            const saveLog = async () => {
                setLoading(true);
                const newLog = { id: Date.now(), machineName: selM, weight: Number(weight), reps: Number(reps), sets: Number(sets), date: new Date().toISOString() };
                const updatedLogs = [newLog, ...logs];
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(updatedLogs, null, 2))));
                const url = "https://api.github.com/repos/" + config.owner + "/" + config.repo + "/contents/" + config.path;
                
                try {
                    const res = await fetch(url, {
                        method: 'PUT',
                        headers: { 
                            "Content-Type": "application/json",
                            "Authorization": getAuthHeader(config.token),
                            "Accept": "application/vnd.github+json"
                        },
                        body: JSON.stringify({ message: "Update logs v6.4", content, sha: fileSha })
                    });
                    
                    if (!res.ok) {
                        const errorBody = await res.json().catch(() => ({}));
                        throw new Error(res.status + ": " + (errorBody.message || res.statusText));
                    }

                    const data = await res.json();
                    setLogs(updatedLogs);
                    setFileSha(data.content.sha);
                    setView('history');
                } catch (err) {
                    alert("【保存失敗】\n" + err.message + "\n\n※Classic Tokenの'repo'権限にチェックが入っているか確認してください！");
                } finally {
                    setLoading(false);
                }
            };

            const saveConfig = async (e) => {
                e.preventDefault();
                const cleanedConfig = {
                    ...config,
                    token: config.token.trim(),
                    owner: config.owner.trim(),
                    repo: config.repo.trim()
                };
                
                localStorage.setItem('lean_forge_config', JSON.stringify(cleanedConfig));
                setConfig(cleanedConfig);
                const success = await loadData(cleanedConfig);
                if (success) setView('input');
            };

            const fullReset = () => {
                if (confirm("設定を完全に初期化しますか？")) {
                    localStorage.removeItem('lean_forge_config');
                    window.location.reload();
                }
            };

            const chartData = useMemo(() => {
                const filtered = logs.filter(l => l.machineName === selM).sort((a, b) => new Date(a.date) - new Date(b.date));
                if (filtered.length === 0) return [];
                const startW = Number(filtered[0].weight);
                const targetW = startW * 1.2;
                const totalD = (END_DATE - START_DATE) / 86400000;
                const pts = filtered.map(l => {
                    const d = (new Date(l.date) - START_DATE) / 86400000;
                    return { 
                        date: new Date(l.date).toLocaleDateString('ja-JP', {month:'2-digit', day:'2-digit'}), 
                        real: Number(l.weight), 
                        ideal: Math.round((startW + (targetW - startW) * (Math.max(0, d) / totalD)) * 10) / 10 
                    };
                });
                pts.push({ date: "08/31", real: null, ideal: Math.round(targetW * 10) / 10 });
                return pts;
            }, [logs, selM]);

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 pb-24 px-4 overflow-x-hidden">
                    <header className="py-8 flex justify-between items-center max-w-md mx-auto">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg"><i className="fas fa-sync text-xl"></i></div>
                            <div>
                                <h1 className="text-2xl font-black italic uppercase tracking-tighter">LEAN FORGE</h1>
                                <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">v6.4 Visual Sync</p>
                            </div>
                        </div>
                        <button onClick={() => setView('settings')} className="text-slate-600 p-2 hover:text-blue-500 transition-colors"><i className="fas fa-cog text-xl"></i></button>
                    </header>

                    {view !== 'settings' && (
                        <nav className="max-w-md mx-auto mb-6 flex bg-slate-900 rounded-2xl p-1.5 border border-slate-800 shadow-xl overflow-x-auto no-scrollbar">
                            {['input', 'guide', 'history', 'trends'].map(t => (
                                <button key={t} onClick={() => setView(t)} className={"flex-1 py-3 px-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all " + (view === t ? 'active-tab shadow-lg' : 'text-slate-500')}>{t}</button>
                            ))}
                        </nav>
                    )}

                    <main className="max-w-md mx-auto">
                        {view === 'settings' && (
                            <div className="space-y-6 animate-in">
                                <div className="bg-slate-900 rounded-[2.5rem] p-8 border border-slate-800 shadow-2xl">
                                    <div className="mb-8 p-5 bg-blue-900/20 rounded-3xl border border-blue-800/30 text-center">
                                        <p className="text-[10px] text-blue-400 font-black uppercase tracking-widest mb-1">Target Repository</p>
                                        <p className="text-lg font-black text-white">{config.owner} / {config.repo}</p>
                                    </div>
                                    <form onSubmit={saveConfig} className="space-y-5">
                                        <div>
                                            <label className="text-[9px] text-slate-500 uppercase font-black mb-2 block tracking-widest ml-1">GitHub Token (Classic)</label>
                                            <input type="password" value={config.token} onChange={e => setConfig({...config, token: e.target.value})} placeholder="ghp_..." className="w-full p-4 bg-slate-800 rounded-2xl border border-slate-700 outline-none text-sm font-bold" required />
                                        </div>
                                        <button type="submit" disabled={loading} className="w-full py-5 bg-blue-600 rounded-2xl font-black text-white uppercase mt-4 shadow-xl shadow-blue-900/40 active:scale-[0.98] transition-all">
                                            {loading ? '接続確認中...' : '設定を保存して開始'}
                                        </button>
                                        
                                        <div className="pt-6 grid grid-cols-2 gap-4 mt-6 border-t border-slate-800">
                                            <button type="button" onClick={testConnection} className="py-3 bg-slate-800 text-blue-400 text-[9px] font-black uppercase tracking-widest rounded-xl border border-slate-700">
                                                接続テスト
                                            </button>
                                            <button type="button" onClick={fullReset} className="py-3 bg-red-950/20 text-red-500 text-[9px] font-black uppercase tracking-widest rounded-xl border border-red-900/20">
                                                設定リセット
                                            </button>
                                        </div>
                                    </form>
                                </div>

                                <div className="bg-blue-900/10 rounded-3xl p-6 border border-blue-800/30">
                                    <h3 className="text-xs font-black text-blue-400 uppercase tracking-widest mb-3">🛠 Classic Token 最終チェック</h3>
                                    <ul className="text-[11px] text-blue-200/70 space-y-2 leading-relaxed">
                                        <li className="flex gap-2"><i className="fas fa-check-circle text-blue-500 mt-0.5"></i> <span>発行時に <b>"repo"</b> （リポジトリへのフルアクセス）にチェックを入れましたか？</span></li>
                                        <li className="flex gap-2"><i className="fas fa-check-circle text-blue-500 mt-0.5"></i> <span>発行後、表示された <b>ghp_...</b> をコピーしてここに貼りましたか？</span></li>
                                    </ul>
                                </div>
                            </div>
                        )}

                        {view === 'input' && (
                            <div className="bg-slate-900 rounded-[2.5rem] p-8 border border-slate-800 space-y-7 animate-in">
                                <select value={selM} onChange={e => setSelM(e.target.value)} className="w-full p-4.5 bg-slate-800 rounded-2xl border border-slate-700 font-bold outline-none text-white appearance-none">{MACHINE_LIST.map(m => <option key={m} value={m}>{m}</option>)}</select>
                                <div className="grid grid-cols-3 gap-4">
                                    {[{l:'Kg', v:weight, s:setWeight}, {l:'Reps', v:reps, s:setReps}, {l:'Sets', v:sets, s:setSets}].map(f => (
                                        <div key={f.l} className="text-center">
                                            <label className="text-[9px] text-slate-500 uppercase font-black mb-2 block">{f.l}</label>
                                            <input type="number" step="0.5" value={f.v} onChange={e => f.s(e.target.value)} className="w-full p-4 bg-slate-800 rounded-2xl text-center font-black text-lg border border-slate-700 outline-none" />
                                        </div>
                                    ))}
                                </div>
                                <button onClick={saveLog} disabled={loading} className="w-full py-5.5 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl font-black text-white uppercase tracking-widest shadow-xl shadow-blue-900/50 active:scale-[0.98] transition-all">{loading ? 'SYNCING...' : 'RECORD & FORGE'}</button>
                            </div>
                        )}

                        {view === 'history' && (
                            <div className="space-y-4 animate-in">
                                {logs.length === 0 ? <div className="text-center py-24 opacity-20 font-black text-[10px] uppercase tracking-widest">No logs found in cloud</div> : logs.map(log => (
                                    <div key={log.id} className="bg-slate-900 p-6 rounded-[2rem] flex justify-between items-center border border-slate-800 shadow-xl">
                                        <div><div className="font-black text-slate-200 text-[14px]">{log.machineName}</div><div className="text-[9px] text-slate-500 font-black mt-2 uppercase tracking-widest">{new Date(log.date).toLocaleDateString()}</div></div>
                                        <div className="text-right"><div className="flex items-baseline justify-end"><span className="text-2xl font-black text-blue-500 tracking-tighter">{log.weight}</span><span className="text-[10px] text-slate-500 ml-1 uppercase">kg</span></div><div className="text-[11px] font-black text-slate-400 italic opacity-80">{log.reps}R × {log.sets}S</div></div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {view === 'trends' && (
                            <div className="bg-slate-900 rounded-[2.5rem] p-8 border border-slate-800 shadow-2xl animate-in">
                                <div className="flex justify-between items-center mb-6"><h2 className="text-[10px] text-slate-500 font-black uppercase tracking-widest ml-1 text-blue-400">Real vs Ideal Trajectory</h2></div>
                                <select value={selM} onChange={e => setSelM(e.target.value)} className="w-full p-4 bg-slate-800 rounded-2xl mb-8 border border-slate-700 font-black text-white outline-none">{MACHINE_LIST.map(m => <option key={m} value={m}>{m}</option>)}</select>
                                <div className="h-72 -ml-4">
                                    {chartData.length > 1 ? (
                                        <Recharts.ResponsiveContainer width="100%" height="100%">
                                            <Recharts.ComposedChart data={chartData}>
                                                <defs><linearGradient id="rG" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#3b82f6" stopOpacity={0.4}/><stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/></linearGradient></defs>
                                                <Recharts.CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#1e293b" /><Recharts.XAxis dataKey="date" fontSize={10} tick={{fill:'#64748b'}} axisLine={false} tickLine={false} /><Recharts.YAxis fontSize={10} tick={{fill:'#64748b'}} domain={['auto', 'auto']} axisLine={false} tickLine={false} />
                                                <Recharts.Area type="monotone" dataKey="real" stroke="#3b82f6" fill="url(#rG)" strokeWidth={4} dot={{r: 5, fill: '#3b82f6'}} />
                                                <Recharts.Line type="monotone" dataKey="ideal" stroke="#475569" strokeWidth={2} strokeDasharray="5 5" dot={false} />
                                            </Recharts.ComposedChart>
                                        </Recharts.ResponsiveContainer>
                                    ) : <div className="h-full flex flex-col items-center justify-center space-y-4 opacity-20 text-center"><i className="fas fa-chart-line text-4xl mb-2"></i><p className="text-[10px] uppercase font-black tracking-widest leading-loose">Analyzing trajectory...<br/>Input records to unlock curve.</p></div>}
                                </div>
                            </div>
                        )}

                        {view === 'guide' && (
                            <div className="space-y-4 animate-in">
                                {ROUTINE.map(r => (
                                    <div key={r.day} className="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-lg">
                                        <div className="flex justify-between items-center mb-4"><span className="bg-blue-600 text-[10px] font-black px-3 py-1 rounded-full uppercase italic tracking-tighter">{r.day} Protocol</span><span className="text-xs font-bold text-slate-400 uppercase tracking-tight">{r.title}</span></div>
                                        <div className="flex flex-wrap gap-2">{r.items.map(i => <span key={i} className="bg-slate-800 text-[11px] px-4 py-2.5 rounded-xl border border-slate-700 font-bold text-slate-300">{i}</span>)}</div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>
                    <footer className="text-center py-12 opacity-20">
                        <p className="text-[8px] font-black tracking-[0.5em] uppercase italic underline decoration-blue-500 decoration-2 underline-offset-4">Forge Your Destiny</p>
                    </footer>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
